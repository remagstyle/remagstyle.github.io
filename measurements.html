<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Measurements | REMAGSTYLE</title>
    <link rel="icon" type="image/png" href="image/Logo.png">
    <link rel="stylesheet" href="site.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-brand-bg text-brand-text">
    <header class="border-b border-brand-border/60 bg-brand-bg/95">
        <nav class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4 sm:px-8 lg:px-12">
            <a href="index.html" aria-label="REMAGSTYLE home"><img src="image/Logo.png" alt="REMAGSTYLE" class="h-14 w-14 object-contain"></a>
            <a href="index.html" class="text-[10px] font-medium uppercase tracking-[0.18em] hover:opacity-50">Back to site</a>
        </nav>
    </header>
    <main class="mx-auto max-w-3xl px-5 py-10 sm:px-8 sm:py-16">
        <p class="text-[10px] font-medium uppercase tracking-[0.25em] text-brand-muted">Bespoke Measurements</p>
        <h1 class="mt-2 font-serif text-4xl font-light sm:text-5xl">Your measurements</h1>
        <p id="measurement-intro" class="mt-3 text-xs leading-6 text-brand-muted">Loading your selected garment...</p>
        <section class="mt-8 border border-brand-border bg-white p-5 sm:p-8">
            <form id="measurements-form" class="space-y-5">
                <h2 id="measurement-stage-title" class="font-serif text-2xl font-light">Measurements</h2>
                <div id="measurement-fields" class="grid grid-cols-1 gap-4 sm:grid-cols-2"></div>
                <div class="flex gap-3">
                    <button type="button" id="measurements-back-btn" class="w-1/3 border border-brand-text py-3.5 text-[10px] font-medium uppercase tracking-[0.2em] text-brand-text transition-colors hover:bg-brand-text hover:text-white">Back</button>
                    <button type="button" id="measurement-next-btn" class="hidden flex-1 bg-brand-text py-3.5 text-[10px] font-medium uppercase tracking-[0.2em] text-white transition-colors hover:bg-black/80">Next</button>
                    <button type="submit" id="submit-order-btn" class="flex-1 bg-brand-text py-3.5 text-[10px] font-medium uppercase tracking-[0.2em] text-white transition-colors hover:bg-black/80">Submit Order</button>
                </div>
                <p id="measurement-message" class="hidden p-3 text-[11px]" role="status"></p>
            </form>
        </section>
    </main>
    <script src="measurements.js" type="module"></script>
</body>
</html>
