    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F9F8F6; color: #111111; -webkit-font-smoothing: antialiased; }
        .font-serif { font-family: 'Cormorant Garamond', serif; }
        ::-webkit-scrollbar { width: 5px; height: 4px; }
        ::-webkit-scrollbar-track { background: #F9F8F6; }
        ::-webkit-scrollbar-thumb { background: #D1CDC6; border-radius: 9999px; }

        @keyframes tile-rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

        /* Pinterest-style tiles: each keeps its own proportions (set from the real photo size). */
        .tile { position: relative; display: block; width: 100%; padding: 0; border: 0; cursor: zoom-in; overflow: hidden; border-radius: 12px; background: #EFECE6; aspect-ratio: var(--r, 0.8); animation: tile-rise .7s cubic-bezier(.16, 1, .3, 1) both; }
        .tile.settled { animation: none; }
        .tile img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .7s cubic-bezier(.16, 1, .3, 1); }
        .tile:hover img, .tile:focus-visible img { transform: scale(1.045); }
        .tile:focus-visible { outline: 2px solid #111111; outline-offset: 3px; }
        /* Instagram-style hover caption */
        .tile::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0, 0, 0, .55), rgba(0, 0, 0, 0) 55%); opacity: 0; transition: opacity .35s; pointer-events: none; }
        .tile-caption { position: absolute; left: 12px; right: 12px; bottom: 10px; z-index: 1; color: #fff; font-size: 12px; line-height: 1.4; text-align: left; opacity: 0; transform: translateY(6px); transition: opacity .35s, transform .35s; }
        @media (hover: hover) {
            .tile:hover::after, .tile:focus-visible::after { opacity: 1; }
            .tile:hover .tile-caption, .tile:focus-visible .tile-caption { opacity: 1; transform: none; }
        }
        .tile-badge { position: absolute; top: 10px; right: 10px; z-index: 2; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9999px; background: rgba(17, 17, 17, .55); backdrop-filter: blur(4px); color: #fff; }
        .skeleton { width: 100%; border-radius: 12px; aspect-ratio: var(--r, 0.8); background: linear-gradient(100deg, #EFECE6 30%, #F7F5F0 50%, #EFECE6 70%); background-size: 200% 100%; animation: shimmer 1.6s linear infinite; }
        .chip { padding: 8px 18px; border: 1px solid #111111; border-radius: 9999px; font-size: 10px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: #111111; background: transparent; transition: background-color .25s, color .25s; }
        .chip[aria-pressed="true"], .chip:hover { background: #111111; color: #fff; }
        .chip:disabled { opacity: .35; cursor: not-allowed; background: transparent; color: #111111; }

        /* Full-screen viewer */
        #lightbox { position: fixed; inset: 0; z-index: 60; display: none; flex-direction: column; background: rgba(10, 10, 10, .96); }
        #lightbox.open { display: flex; }
        .lb-stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 60px 16px 8px; }
        .lb-stage img, .lb-stage video { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; background: #000; }
        .lb-btn { position: absolute; z-index: 2; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 9999px; background: rgba(255, 255, 255, .12); color: #fff; transition: background-color .2s; }
        .lb-btn:hover, .lb-btn:focus-visible { background: rgba(255, 255, 255, .28); outline: none; }
        .lb-info { flex: none; padding: 8px 20px 22px; text-align: center; color: #fff; }
        @media (prefers-reduced-motion: reduce) {
            .tile, .skeleton { animation: none; }
            .tile img { transition: none; }
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyCzcxTLAUH83sQsia4dPg5py19YzRsmw0o",
            authDomain: "remagstyle-43b41.firebaseapp.com",
            projectId: "remagstyle-43b41",
            messagingSenderId: "145831201308",
            appId: "1:145831201308:web:489a014516356f73a72dd9"
        });
        const db = getFirestore(app);
        const $ = (id) => document.getElementById(id);

        const BASE = 'https://res.cloudinary.com/hjsztwfj';
        const ID_RE = /^remagstyle-gallery\/[a-f0-9]{32}$/;
        const VIDEO_FORMATS = ['mp4', 'mov', 'webm', 'm4v'];
        // Keep tiles tidy: very tall or very wide pieces are cropped a little in the grid (never in the viewer).
        const clampRatio = (width, height) => Math.min(1.35, Math.max(0.75, width > 0 && height > 0 ? width / height : 0.8));

        // Shown until the first photos are uploaded from the admin dashboard.
        const FALLBACK = [[1, 1440, 1747, 'Man wearing a gold and black patterned tailored jacket with matching shorts'], [2, 1080, 1074, 'Woman in a pink and red patterned dress with a ruffled shoulder'], [3, 1440, 1797, 'Woman in a short red sequined dress with sheer lace sleeves'], [4, 1280, 1597, 'Woman in a cream corset-style gown with a sheer tulle train, holding dried flowers'], [5, 1440, 1797, 'Smiling woman in an orange satin dress and a magenta head wrap'], [6, 1440, 1797, 'Man in a white traditional outfit with an orange embroidered front panel']]
            .map(([number, width, height, name]) => ({ kind: 'image', caption: '', alt: name, ratio: clampRatio(width, height), thumb: `image/${number}.jpg`, full: `image/${number}.jpg` }));

        // Only well-formed gallery records are used; URLs are built from a validated id, never from free text.
        function itemFromRecord(data) {
            if (!data || !ID_RE.test(data.publicId)) return null;
            const caption = typeof data.caption === 'string' ? data.caption.trim().slice(0, 80) : '';
            const collectionId = typeof data.collectionId === 'string' && data.collectionId ? data.collectionId : null;
            const ratio = clampRatio(Number(data.width), Number(data.height));
            if (data.resourceType === 'image') {
                return { kind: 'image', caption, ratio, collectionId,
                    thumb: `${BASE}/image/upload/c_limit,w_600,f_auto,q_auto/${data.publicId}`,
                    full: `${BASE}/image/upload/c_limit,w_1600,f_auto,q_auto/${data.publicId}` };
            }
            if (data.resourceType === 'video') {
                const format = VIDEO_FORMATS.includes(data.format) ? data.format : 'mp4';
                return { kind: 'video', caption, ratio, collectionId,
                    thumb: `${BASE}/video/upload/so_0,c_limit,w_600,f_jpg,q_auto/${data.publicId}.jpg`,
                    full: `${BASE}/video/upload/f_auto,q_auto/${data.publicId}`,
                    original: `${BASE}/video/upload/${data.publicId}.${format}` };
            }
            return null;
        }

        const NAME_MAX = 40;
        const cleanName = (value) => (typeof value === 'string' ? value.replace(/\s+/g, ' ').trim().slice(0, NAME_MAX).trim() : '');

        let items = [];
        let visible = [];
        let currentColumns = 0;
        let collectionList = []; // only collections that have at least one piece
        let activeCollection = 'all';
        let activeKind = 'all';
        const tiles = new Map();
        const masonry = $('masonry');

        function makeTile(item, index) {
            const tile = document.createElement('button');
            tile.type = 'button';
            tile.className = 'tile';
            tile.style.setProperty('--r', item.ratio);
            tile.style.animationDelay = `${Math.min(index, 12) * 40}ms`;
            tile.addEventListener('animationend', () => tile.classList.add('settled'), { once: true });
            tile.setAttribute('aria-label', `${item.kind === 'video' ? 'Play video' : 'View photo'}${item.caption ? `: ${item.caption}` : ''}`);
            const picture = document.createElement('img');
            picture.src = item.thumb;
            picture.alt = item.alt || item.caption || 'REMAGSTYLE design';
            picture.loading = 'lazy';
            picture.decoding = 'async';
            picture.addEventListener('error', () => picture.remove());
            tile.append(picture);
            if (item.kind === 'video') {
                const badge = document.createElement('span');
                badge.className = 'tile-badge';
                badge.innerHTML = '<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
                tile.append(badge);
            }
            if (item.caption) {
                const caption = document.createElement('span');
                caption.className = 'tile-caption';
                caption.textContent = item.caption;
                tile.append(caption);
            }
            tile.addEventListener('click', () => openViewer(visible.indexOf(item)));
            return tile;
        }

        const columnsFor = (width) => (width >= 1100 ? 4 : width >= 700 ? 3 : 2);

        // Pinterest-style placement: each piece goes into the shortest column, so newest pieces fill the top row first.
        function layout() {
            const count = columnsFor(masonry.clientWidth);
            masonry.replaceChildren();
            const columns = Array.from({ length: count }, () => {
                const column = document.createElement('div');
                column.className = 'flex-1 min-w-0 flex flex-col gap-3 sm:gap-4';
                masonry.append(column);
                return column;
            });
            const heights = Array(count).fill(0);
            for (const item of visible) {
                let target = 0;
                for (let index = 1; index < count; index += 1) if (heights[index] < heights[target] - 1e-9) target = index;
                columns[target].append(tiles.get(item));
                heights[target] += 1 / item.ratio + 0.05;
            }
            currentColumns = count;
        }

        function showSkeleton() {
            const count = columnsFor(masonry.clientWidth);
            const ratios = [0.8, 1.2, 0.9, 1.3, 0.75, 1.1, 0.85, 1];
            masonry.replaceChildren();
            const heights = Array(count).fill(0);
            const columns = Array.from({ length: count }, () => {
                const column = document.createElement('div');
                column.className = 'flex-1 min-w-0 flex flex-col gap-3 sm:gap-4';
                masonry.append(column);
                return column;
            });
            for (let index = 0; index < count * 3; index += 1) {
                const block = document.createElement('div');
                block.className = 'skeleton';
                block.style.setProperty('--r', ratios[index % ratios.length]);
                const target = heights.indexOf(Math.min(...heights));
                columns[target].append(block);
                heights[target] += 1 / ratios[index % ratios.length];
            }
        }

        const collectionLabel = (id) => (collectionList.find((entry) => entry.id === id) || {}).name || '';

        function renderCollectionChips() {
            const bar = $('collections');
            bar.replaceChildren();
            bar.classList.toggle('hidden', collectionList.length === 0);
            const make = (id, text) => {
                const chip = document.createElement('button');
                chip.type = 'button';
                chip.className = 'chip';
                chip.dataset.collection = id;
                chip.setAttribute('aria-pressed', String(activeCollection === id));
                chip.textContent = text;
                chip.addEventListener('click', () => { activeCollection = id; applyFilters(); });
                bar.append(chip);
            };
            make('all', 'All');
            for (const entry of collectionList) make(entry.id, entry.name);
        }

        function applyFilters() {
            const inCollection = activeCollection === 'all' ? items : items.filter((item) => item.collectionId === activeCollection);
            // A piece type with nothing in this collection is switched off, and we fall back to "all" if it was selected.
            const kindsHere = new Set(inCollection.map((item) => item.kind));
            document.querySelectorAll('#filters .chip').forEach((chip) => {
                const kind = chip.dataset.filter;
                chip.disabled = kind !== 'all' && !kindsHere.has(kind);
            });
            if (activeKind !== 'all' && !kindsHere.has(activeKind)) activeKind = 'all';
            visible = activeKind === 'all' ? inCollection : inCollection.filter((item) => item.kind === activeKind);
            document.querySelectorAll('#filters .chip').forEach((chip) => chip.setAttribute('aria-pressed', String(chip.dataset.filter === activeKind)));
            document.querySelectorAll('#collections .chip').forEach((chip) => chip.setAttribute('aria-pressed', String(chip.dataset.collection === activeCollection)));
            $('count').textContent = `${visible.length} ${visible.length === 1 ? 'piece' : 'pieces'}`;
            try {
                const url = new URL(window.location.href);
                if (activeCollection === 'all') url.searchParams.delete('collection'); else url.searchParams.set('collection', activeCollection);
                window.history.replaceState(null, '', url);
            } catch { /* address bar update is a nicety only */ }
            layout();
        }

        // ---------- Full-screen viewer ----------
        const lightbox = $('lightbox');
        const stage = $('lb-stage');
        let current = -1;
        let lastFocus = null;

        function showItem(index) {
            current = (index + visible.length) % visible.length;
            const item = visible[current];
            stage.replaceChildren(); // also stops any video that was playing
            let media;
            if (item.kind === 'video') {
                media = document.createElement('video');
                media.controls = true;
                media.playsInline = true;
                media.preload = 'metadata'; // no autoplay and no big download until the visitor presses play
                media.poster = item.thumb;
                media.src = item.full;
                let retried = false;
                media.addEventListener('error', () => { if (!retried && item.original) { retried = true; media.src = item.original; } });
            } else {
                media = document.createElement('img');
                media.alt = item.alt || item.caption || 'REMAGSTYLE design';
                media.decoding = 'async';
                media.src = item.full;
                media.addEventListener('error', () => { if (!media.src.endsWith(item.thumb)) media.src = item.thumb; });
            }
            stage.append(media);
            const label = item.collectionId ? collectionLabel(item.collectionId) : '';
            $('lb-collection').textContent = label;
            $('lb-collection').classList.toggle('hidden', !label);
            $('lb-caption').textContent = item.caption;
            $('lb-caption').classList.toggle('hidden', !item.caption);
            $('lb-count').textContent = `${current + 1} / ${visible.length}`;
            const several = visible.length > 1;
            $('lb-prev').classList.toggle('hidden', !several);
            $('lb-next').classList.toggle('hidden', !several);
            if (several) for (const step of [-1, 1]) {
                const neighbour = visible[(current + step + visible.length) % visible.length];
                if (neighbour.kind === 'image') new Image().src = neighbour.full; // load the next picture ahead of time
            }
        }

        function openViewer(index) {
            if (index < 0) return;
            lastFocus = document.activeElement;
            lightbox.classList.add('open');
            document.body.style.overflow = 'hidden';
            $('site-header').setAttribute('inert', '');
            $('main').setAttribute('inert', '');
            showItem(index);
            $('lb-close').focus();
        }

        function closeViewer() {
            stage.replaceChildren();
            lightbox.classList.remove('open');
            document.body.style.overflow = '';
            $('site-header').removeAttribute('inert');
            $('main').removeAttribute('inert');
            current = -1;
            if (lastFocus && typeof lastFocus.focus === 'function') lastFocus.focus();
        }

        $('lb-close').addEventListener('click', closeViewer);
        $('lb-prev').addEventListener('click', () => showItem(current - 1));
        $('lb-next').addEventListener('click', () => showItem(current + 1));
        lightbox.addEventListener('click', (event) => { if (event.target === lightbox || event.target === stage) closeViewer(); });
        document.addEventListener('keydown', (event) => {
            if (!lightbox.classList.contains('open')) return;
            if (event.key === 'Escape') closeViewer();
            else if (event.key === 'ArrowLeft' && visible.length > 1) showItem(current - 1);
            else if (event.key === 'ArrowRight' && visible.length > 1) showItem(current + 1);
        });
        let touchStart = null;
        lightbox.addEventListener('touchstart', (event) => { touchStart = { x: event.touches[0].clientX, y: event.touches[0].clientY }; }, { passive: true });
        lightbox.addEventListener('touchend', (event) => {
            if (!touchStart || visible.length < 2) return;
            const dx = event.changedTouches[0].clientX - touchStart.x;
            const dy = event.changedTouches[0].clientY - touchStart.y;
            touchStart = null;
            if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) showItem(current + (dx < 0 ? 1 : -1));
        }, { passive: true });

        // ---------- Page setup ----------
        document.querySelectorAll('#filters .chip').forEach((chip) => chip.addEventListener('click', () => { if (chip.disabled) return; activeKind = chip.dataset.filter; applyFilters(); }));
        $('year').textContent = new Date().getFullYear();
        const menuButton = $('mobile-menu-btn');
        menuButton.addEventListener('click', () => {
            const open = $('mobile-menu').classList.toggle('hidden') === false;
            menuButton.setAttribute('aria-expanded', String(open));
        });
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => { if (columnsFor(masonry.clientWidth) !== currentColumns && visible.length) layout(); }, 120);
        });

        async function readList(name) {
            try {
                return (await getDocs(collection(db, name))).docs.map((record) => ({ id: record.id, data: record.data() }));
            } catch (error) {
                console.error(`Could not load "${name}".`, error);
                return [];
            }
        }

        async function load() {
            showSkeleton();
            const [galleryRecords, collectionRecords] = await Promise.all([readList('gallery'), readList('galleryCollections')]);
            const names = new Map();
            for (const record of collectionRecords) {
                const name = cleanName(record.data.name);
                if (name) names.set(record.id, name);
            }
            const uploaded = galleryRecords
                .map((record) => {
                    const item = itemFromRecord(record.data);
                    // A piece pointing at a missing or deleted collection simply shows under "All".
                    if (item && item.collectionId && !names.has(item.collectionId)) item.collectionId = null;
                    return { item, time: record.data.createdAt?.toMillis?.() || 0 };
                })
                .filter((entry) => entry.item)
                .sort((first, second) => second.time - first.time)
                .map((entry) => entry.item);
            items = uploaded.length ? uploaded : FALLBACK;
            items.forEach((item, index) => tiles.set(item, makeTile(item, index)));
            // Only collections that actually contain something are shown to visitors.
            const used = new Set(items.map((item) => item.collectionId).filter(Boolean));
            collectionList = Array.from(names, ([id, name]) => ({ id, name })).filter((entry) => used.has(entry.id))
                .sort((first, second) => first.name.localeCompare(second.name, undefined, { sensitivity: 'base' }));
            const wanted = new URLSearchParams(window.location.search).get('collection');
            if (wanted && collectionList.some((entry) => entry.id === wanted)) activeCollection = wanted;
            const kinds = new Set(items.map((item) => item.kind));
            $('filters').classList.toggle('hidden', kinds.size < 2);
            masonry.setAttribute('aria-busy', 'false');
            renderCollectionChips();
            applyFilters();
        }
        load();
    </script>
</body>
</html>
