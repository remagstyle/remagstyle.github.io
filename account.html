<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Account | REMAGSTYLE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { ink: '#161616', paper: '#F7F6F2', line: '#DDD9D0', clay: '#B86F52', moss: '#4F6656' }, fontFamily: { serif: ['Georgia', 'serif'], sans: ['Arial', 'sans-serif'] } } } };</script>
    <style>@media print { .no-print { display: none !important; } body { background: white; } #document { border: 0; } }</style>
</head>
<body class="min-h-screen bg-paper text-ink">
    <main class="mx-auto max-w-3xl px-5 py-10 sm:px-8 sm:py-16">
        <div class="no-print mb-8 flex items-center justify-between border-b border-line pb-5"><a href="index.html" class="text-[10px] uppercase tracking-[0.2em]">REMAGSTYLE</a><span class="text-[10px] uppercase tracking-[0.16em] text-stone-500">Client account</span></div>
        <div id="loading" class="py-20 text-center text-xs text-stone-500">Loading document...</div>
        <div id="document" class="hidden border border-line bg-white p-6 sm:p-12"></div>
        <div id="actions" class="no-print mt-6 hidden flex flex-wrap gap-2"><button id="print-button" class="bg-ink px-5 py-3 text-[10px] uppercase tracking-[0.18em] text-white hover:bg-black/80">Print / save as PDF</button><button id="download-button" class="border border-ink px-5 py-3 text-[10px] uppercase tracking-[0.18em] hover:bg-ink hover:text-white">Download document</button></div>
    </main>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
        import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
        const app = initializeApp({ apiKey: 'AIzaSyCzcxTLAUH83sQsia4dPg5py19YzRsmw0o', authDomain: 'remagstyle-43b41.firebaseapp.com', projectId: 'remagstyle-43b41', messagingSenderId: '145831201308', appId: '1:145831201308:web:489a014516356f73a72dd9' });
        const db = getFirestore(app);
        const $ = (id) => document.getElementById(id);
        const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (character) => ({ '&': '&#38;', '<': '&#60;', '>': '&#62;', "'": '&#39;', '"': '&#34;' })[character]);
        const money = (value, currency) => `${currency || 'NGN'} ${Number(value || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        let account;
        function renderDocument() { const date = account.createdAt?.toDate?.().toLocaleDateString(undefined, { dateStyle: 'long' }) || new Date().toLocaleDateString(undefined, { dateStyle: 'long' }); $('document').innerHTML = `<div class="flex flex-col justify-between gap-8 border-b border-line pb-8 sm:flex-row"><div><p class="text-[10px] uppercase tracking-[0.22em] text-stone-500">REMAGSTYLE</p><h1 class="mt-4 font-serif text-4xl font-light">${escapeHtml(account.documentType)}</h1></div><div class="text-left text-xs sm:text-right"><p class="font-medium">${escapeHtml(account.documentNumber)}</p><p class="mt-1 text-stone-500">${escapeHtml(date)}</p></div></div><div class="grid gap-5 border-b border-line py-7 text-xs sm:grid-cols-2"><p class="text-stone-500">Prepared for<br><strong class="font-normal text-ink">${escapeHtml(account.clientName)}</strong><br><span class="text-stone-500">${escapeHtml(account.clientEmail)}</span></p><p class="text-stone-500">Order reference<br><strong class="font-normal text-ink">${escapeHtml(account.orderNumber || 'Not supplied')}</strong></p></div><table class="w-full text-left text-xs"><thead><tr class="border-b border-line text-[10px] uppercase tracking-[0.16em] text-stone-500"><th class="py-4 font-normal">Description</th><th class="py-4 text-right font-normal">Amount</th></tr></thead><tbody>${(account.lineItems || []).map((item) => `<tr class="border-b border-line"><td class="py-4">${escapeHtml(item.description)}</td><td class="py-4 text-right">${escapeHtml(money(item.amount, account.currency))}</td></tr>`).join('')}</tbody></table><div class="ml-auto mt-6 max-w-xs border-t border-ink pt-4"><div class="flex justify-between text-sm font-medium"><span>Total</span><span>${escapeHtml(money(account.total, account.currency))}</span></div></div>${account.notes ? `<div class="mt-10 border-l-2 border-line px-4 text-xs leading-6 text-stone-500"><span class="uppercase tracking-[0.16em] text-ink">Notes</span><br>${escapeHtml(account.notes)}</div>` : ''}<p class="mt-12 text-[10px] uppercase tracking-[0.16em] text-stone-400">Thank you for choosing REMAGSTYLE.</p>`; $('loading').classList.add('hidden'); $('document').classList.remove('hidden'); $('actions').classList.remove('hidden'); }
        function downloadDocument() { const content = `<!doctype html><html><head><meta charset="utf-8"><title>${account.documentNumber}</title><style>body{font:14px Arial,sans-serif;max-width:760px;margin:60px auto;color:#161616}table{width:100%;border-collapse:collapse}td,th{padding:14px 0;border-bottom:1px solid #ddd;text-align:left}td:last-child,th:last-child{text-align:right}.total{text-align:right;margin-top:24px;font-weight:bold}</style></head><body><h1>${escapeHtml(account.documentType)}</h1><p>${escapeHtml(account.documentNumber)}<br>${escapeHtml(account.clientName)}<br>${escapeHtml(account.clientEmail)}</p><table><tr><th>Description</th><th>Amount</th></tr>${(account.lineItems || []).map((item) => `<tr><td>${escapeHtml(item.description)}</td><td>${escapeHtml(money(item.amount, account.currency))}</td></tr>`).join('')}</table><p class="total">Total: ${escapeHtml(money(account.total, account.currency))}</p>${account.notes ? `<p>${escapeHtml(account.notes)}</p>` : ''}</body></html>`; const link = document.createElement('a'); link.href = URL.createObjectURL(new Blob([content], { type: 'text/html' })); link.download = `${account.documentNumber}.html`; link.click(); URL.revokeObjectURL(link.href); }
        async function loadAccount() { const token = new URLSearchParams(window.location.search).get('token'); if (!token) { $('loading').textContent = 'This client document link is incomplete.'; return; } try { const snapshot = await getDoc(doc(db, 'accounts', token)); if (!snapshot.exists()) { $('loading').textContent = 'This document could not be found or the link has expired.'; return; } account = snapshot.data(); renderDocument(); } catch (error) { $('loading').textContent = 'We could not load this document right now.'; console.error(error); } }
        $('print-button').addEventListener('click', () => window.print()); $('download-button').addEventListener('click', downloadDocument); loadAccount();
    </script>
</body>
</html>
