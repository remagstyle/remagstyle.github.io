<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Account | REMAGSTYLE</title>
    <link rel="stylesheet" href="site.css">
</head>
<body class="min-h-screen bg-paper text-ink">
    <main class="mx-auto max-w-3xl px-5 py-10 sm:px-8 sm:py-16">
        <div class="no-print mb-8 flex items-center justify-between border-b border-line pb-5"><a href="index.html" class="text-[10px] uppercase tracking-[0.2em]">REMAGSTYLE</a><span class="text-[10px] uppercase tracking-[0.16em] text-stone-500">Client account</span></div>
        <div id="loading" class="py-20 text-center text-xs text-stone-500">Loading document...</div>
        <div id="document" class="hidden border border-line bg-white p-6 sm:p-12"></div>
        <div id="actions" class="no-print mt-6 hidden flex flex-wrap gap-2"><button id="print-button" class="bg-ink px-5 py-3 text-[10px] uppercase tracking-[0.18em] text-white hover:bg-black/80">Print / save as PDF</button><button id="download-button" class="border border-ink px-5 py-3 text-[10px] uppercase tracking-[0.18em] hover:bg-ink hover:text-white">Download document</button></div>
    </main>
    <script src="account.js" type="module"></script>
</body>
</html>
