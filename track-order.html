<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order | REMAGSTYLE</title>
    <link rel="icon" type="image/png" href="image/Logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { brand: { bg: '#F9F8F6', text: '#111111', muted: '#666666', border: '#E2DFD8' } }, fontFamily: { serif: ['Cormorant Garamond', 'Georgia', 'serif'], sans: ['Inter', 'sans-serif'] } } } };</script>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; } .font-serif { font-family: 'Cormorant Garamond', serif; }</style>
</head>
<body class="min-h-screen bg-brand-bg text-brand-text">
    <header class="border-b border-brand-border/60 bg-brand-bg/95"><nav class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4 sm:px-8 lg:px-12"><a href="index.html" aria-label="REMAGSTYLE home"><img src="image/Logo.png" alt="REMAGSTYLE" class="h-14 w-14 object-contain"></a><div class="flex items-center gap-4"><a href="guest-order.html" class="text-[10px] font-medium uppercase tracking-[0.18em] hover:opacity-50">Place Order</a><a href="index.html" class="text-[10px] font-medium uppercase tracking-[0.18em] hover:opacity-50">Back to site</a></div></nav></header>
    <main class="mx-auto max-w-2xl px-5 py-16 sm:px-8 sm:py-24"><div class="mb-8 text-center"><p class="text-[10px] font-medium uppercase tracking-[0.25em] text-brand-muted">Order Tracking</p><h1 class="mt-2 font-serif text-5xl font-light">Find your order</h1><p class="mx-auto mt-3 max-w-md text-xs leading-6 text-brand-muted">Enter the special order number from your confirmation. Account and guest orders use the same tracking form.</p></div><form id="track-form" class="flex flex-col gap-3 sm:flex-row"><input id="order-number" required placeholder="RS-2026-XXXXXXXX" class="min-w-0 flex-1 border border-brand-border bg-white px-4 py-3 text-xs uppercase tracking-[0.12em] focus:border-brand-text focus:outline-none"><button class="bg-brand-text px-6 py-3 text-[10px] font-medium uppercase tracking-[0.2em] text-white hover:bg-black/80">Track Order</button></form><div id="track-result" class="mt-8"></div></main>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, getDoc, updateDoc, doc, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        const app = initializeApp({ apiKey: "AIzaSyCzcxTLAUH83sQsia4dPg5py19YzRsmw0o", authDomain: "remagstyle-43b41.firebaseapp.com", projectId: "remagstyle-43b41", messagingSenderId: "145831201308", appId: "1:145831201308:web:489a014516356f73a72dd9" });
        const auth = getAuth(app); const db = getFirestore(app); const form = document.getElementById('track-form'); const input = document.getElementById('order-number'); const result = document.getElementById('track-result');
        let liveOrderUnsubscribe = null;
        const paymentWorkerUrl = 'https://remagstyle-paystack-worker.1realstranger.workers.dev';
        function escapeHtml(value) { return String(value ?? '').replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[character]); }
        const PAID_WORDS = ['paid', 'success', 'successful', 'confirmed'];
        let guestEmail = '';
        function showNotice(kind, message) {
            const styles = { success: 'border-green-200 bg-green-50 text-green-700', info: 'border-amber-200 bg-amber-50 text-amber-800', error: 'border-red-200 bg-red-50 text-red-700' };
            const notice = document.createElement('p');
            notice.className = `mb-4 border p-3 text-[11px] ${styles[kind] || styles.info}`;
            notice.setAttribute('role', 'status');
            notice.textContent = message;
            result.prepend(notice);
        }
        function renderAmountDue(order, orderId) {
            // The amount shown here is the same order field the payment server charges: paymentAmount.
            const amountDue = Number(order.paymentAmount);
            const currency = String(order.currency || 'GHS').trim().toUpperCase();
            const hasValidCurrency = /^[A-Z]{3}$/.test(currency);
            const hasAmountDue = Number.isFinite(amountDue) && amountDue > 0;
            const isPaid = PAID_WORDS.includes(String(order.paymentStatus || '').toLowerCase());
            const isCancelled = ['cancelled', 'canceled'].includes(String(order.status || '').toLowerCase());
            const canPay = hasAmountDue && hasValidCurrency && !isPaid && !isCancelled;
            const needsEmail = canPay && !order.userId;
            const money = (value, code) => { try { return new Intl.NumberFormat('en-GH', { style: 'currency', currency: code }).format(value); } catch { return `${Number(value).toFixed(2)} ${code}`; } };
            const amountLabel = hasAmountDue ? (hasValidCurrency ? money(amountDue, currency) : `${amountDue.toFixed(2)} ${currency}`) : 'Pending';
            const paidDate = order.paidAt ? new Date(order.paidAt) : null;
            const paidLine = isPaid && Number.isFinite(Number(order.paidAmount))
                ? `Received ${money(Number(order.paidAmount), String(order.paidCurrency || currency).toUpperCase())}${paidDate && !Number.isNaN(paidDate.getTime()) ? ` on ${paidDate.toLocaleDateString()}` : ''}`
                : '';
            const badge = isPaid ? 'Paid' : isCancelled ? 'Cancelled' : hasAmountDue ? 'Awaiting payment' : 'Pending';

            const article = result.querySelector('article');
            const existingSection = article?.querySelector('#amount-due-section');
            // Only redraw when something payment-related changed, so typing in the email box is never interrupted.
            const renderKey = [order.paymentAmount, currency, isPaid, isCancelled, needsEmail, order.paidAt, order.paidAmount].join('|');
            if (existingSection && existingSection.dataset.renderKey === renderKey) return;

            const section = document.createElement('section');
            section.id = 'amount-due-section';
            section.dataset.renderKey = renderKey;
            section.className = 'mt-6 border-t border-brand-border pt-5';
            section.innerHTML = `<div class="flex flex-wrap items-center justify-between gap-4"><div><p class="text-[10px] uppercase tracking-[0.18em] text-brand-muted">Amount to be paid</p><p class="mt-1 font-serif text-2xl text-brand-text">${escapeHtml(amountLabel)}</p>${paidLine ? `<p class="mt-1 text-[11px] text-brand-muted">${escapeHtml(paidLine)}</p>` : ''}</div><span class="border border-brand-border px-3 py-2 text-[10px] uppercase tracking-[0.15em] text-brand-muted">${escapeHtml(badge)}</span></div>${needsEmail ? `<label class="mt-4 block text-[10px] uppercase tracking-[0.18em] text-brand-muted">Email for your payment receipt<input id="pay-email" type="email" autocomplete="email" maxlength="254" value="${escapeHtml(guestEmail)}" placeholder="you@example.com" class="mt-2 w-full border border-brand-border bg-brand-bg px-3 py-2.5 text-[11px] normal-case tracking-normal text-brand-text focus:border-brand-text focus:outline-none"></label>` : ''}<button id="pay-now-button" type="button" ${canPay ? '' : 'disabled'} class="mt-4 w-full px-5 py-3 text-[10px] font-medium uppercase tracking-[0.2em] text-white ${canPay ? 'bg-brand-text hover:bg-black/80' : 'cursor-not-allowed bg-gray-300 text-gray-600'}">${isPaid ? 'Paid' : isCancelled ? 'Cancelled' : 'Pay Now'}</button><p id="payment-error" class="mt-3 hidden border border-red-200 bg-red-50 p-3 text-[11px] text-red-700" role="status"></p>`;
            if (existingSection) existingSection.replaceWith(section);
            else article?.append(section);

            const emailInput = section.querySelector('#pay-email');
            emailInput?.addEventListener('input', () => { guestEmail = emailInput.value; });

            section.querySelector('#pay-now-button').addEventListener('click', async (event) => {
                if (!canPay) return;
                const button = event.currentTarget;
                const errorMessage = section.querySelector('#payment-error');
                const fail = (message) => { errorMessage.textContent = message; errorMessage.classList.remove('hidden'); };
                errorMessage.classList.add('hidden');

                let email = '';
                if (emailInput) {
                    email = emailInput.value.trim();
                    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { fail('Please enter a valid email address.'); emailInput.focus(); return; }
                }

                button.disabled = true;
                button.textContent = 'Opening Paystack...';
                try {
                    // Only the order id (and a guest's email) is sent. The amount is decided by the server from Firestore.
                    const headers = { 'Content-Type': 'application/json' };
                    await auth.authStateReady();
                    if (auth.currentUser) headers.Authorization = `Bearer ${await auth.currentUser.getIdToken()}`;
                    const response = await fetch(`${paymentWorkerUrl}/initialize-payment`, {
                        method: 'POST',
                        headers,
                        body: JSON.stringify(email ? { orderId, email } : { orderId })
                    });
                    const checkout = await response.json().catch(() => ({}));
                    if (!response.ok || !checkout.ok || !checkout.authorizationUrl) {
                        throw new Error(checkout.error || 'We could not start payment. Please try again.');
                    }
                    const destination = new URL(checkout.authorizationUrl);
                    if (destination.protocol !== 'https:' || !destination.hostname.endsWith('paystack.com')) {
                        throw new Error('We could not start payment. Please try again.');
                    }
                    window.location.assign(destination.toString());
                } catch (error) {
                    button.disabled = false;
                    button.textContent = 'Pay Now';
                    fail(error.message || 'We could not start payment. Please try again.');
                    console.error('Unable to start Paystack checkout:', error);
                }
            });
        }
        async function trackOrder(orderNumber) {
            liveOrderUnsubscribe?.();
            liveOrderUnsubscribe = null;
            result.innerHTML = '<p class="text-center text-xs text-brand-muted">Looking up your order...</p>';
            try {
                const notFound = '<p class="border border-red-200 bg-red-50 p-4 text-xs text-red-700">No order was found with that number. Check it and try again.</p>';
                // The server turns an order number into the order's private id. Orders can no longer be listed by the public.
                const lookupResponse = await fetch(`${paymentWorkerUrl}/lookup-order`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ orderNumber })
                });
                const lookup = await lookupResponse.json().catch(() => ({}));
                if (lookupResponse.status === 404 || lookupResponse.status === 400) { result.innerHTML = notFound; return; }
                if (lookupResponse.status === 429) { result.innerHTML = '<p class="border border-amber-200 bg-amber-50 p-4 text-xs text-amber-800">Too many attempts. Please wait a minute and try again.</p>'; return; }
                if (!lookupResponse.ok || !lookup.orderId) throw new Error('Order lookup failed.');
                const orderSnapshot = await getDoc(doc(db, 'orders', lookup.orderId));
                if (!orderSnapshot.exists()) { result.innerHTML = notFound; return; }
                const orderDocument = { id: orderSnapshot.id };
                const order = orderSnapshot.data();
                const date = order.createdAt?.toDate?.().toLocaleDateString() || 'Just submitted';
                result.innerHTML = `<article class="border border-brand-border bg-white p-6"><div class="flex flex-wrap items-start justify-between gap-4"><div><p class="text-[10px] uppercase tracking-[0.2em] text-brand-muted">${escapeHtml(order.orderNumber)}</p><h2 class="mt-2 font-serif text-3xl">${escapeHtml(order.garment)}</h2><p class="mt-1 text-xs text-brand-muted">${escapeHtml(order.occasion)}</p></div><span class="border border-brand-border px-3 py-2 text-[10px] uppercase tracking-[0.15em]">${escapeHtml(order.status)}</span></div><div class="mt-6 grid grid-cols-2 gap-4 border-t border-brand-border pt-4 text-xs text-brand-muted"><p>Submitted<br><span class="text-brand-text">${escapeHtml(date)}</span></p><p>Delivery<br><span class="text-brand-text">${escapeHtml(order.deliveryStatus)}</span></p></div>${order.adminMessage ? `<div class="mt-5 border-l-2 border-brand-text bg-brand-bg px-3 py-2 text-[11px] leading-5 text-brand-text"><span class="font-medium uppercase tracking-[0.12em]">Atelier update</span><br>${escapeHtml(order.adminMessage)}</div><form id="guest-reply-form" class="mt-4 flex flex-col gap-2 sm:flex-row"><input name="clientReply" required maxlength="1000" placeholder="Reply to the atelier" class="min-w-0 flex-1 border border-brand-border bg-brand-bg px-3 py-2.5 text-[11px] focus:border-brand-text focus:outline-none"><button type="submit" class="bg-brand-text px-4 py-2.5 text-[10px] font-medium uppercase tracking-[0.15em] text-white hover:bg-black/80">Send reply</button></form>` : ''}${order.clientReply ? `<div class="mt-3 border-l-2 border-brand-border px-3 py-2 text-[11px] leading-5 text-brand-muted"><span class="font-medium uppercase tracking-[0.12em] text-brand-text">Your reply</span><br>${escapeHtml(order.clientReply)}</div>` : ''}</article>`;
                renderAmountDue(order, orderDocument.id);
                liveOrderUnsubscribe = onSnapshot(doc(db, 'orders', orderDocument.id), (snapshot) => {
                    if (snapshot.exists()) renderAmountDue(snapshot.data(), snapshot.id);
                }, (error) => console.error('Unable to listen for order payment updates:', error));
                const replyForm = document.getElementById('guest-reply-form');
                replyForm?.addEventListener('submit', async (event) => {
                    event.preventDefault();
                    const button = replyForm.querySelector('button');
                    const reply = new FormData(replyForm).get('clientReply')?.toString().trim();
                    if (!reply) return;
                    button.disabled = true;
                    button.textContent = 'Sending...';
                    try {
                        await updateDoc(doc(db, 'orders', orderDocument.id), { clientReply: reply, clientReplyAt: serverTimestamp() });
                        order.clientReply = reply;
                        replyForm.outerHTML = `<div class="mt-3 border-l-2 border-brand-border px-3 py-2 text-[11px] leading-5 text-brand-muted"><span class="font-medium uppercase tracking-[0.12em] text-brand-text">Your reply</span><br>${escapeHtml(reply)}</div>`;
                    } catch (error) {
                        button.disabled = false;
                        button.textContent = 'Send reply';
                        console.error('Unable to send guest reply:', error);
                    }
                });
            } catch (error) { result.innerHTML = '<p class="border border-red-200 bg-red-50 p-4 text-xs text-red-700">We could not look up your order right now.</p>'; console.error('Unable to track order:', error); }
        }
        function cleanPaymentParams() {
            const cleanUrl = new URL(window.location.href);
            ['reference', 'trxref', 'payment'].forEach((name) => cleanUrl.searchParams.delete(name));
            window.history.replaceState({}, document.title, `${cleanUrl.pathname}${cleanUrl.search}${cleanUrl.hash}`);
        }
        function noticeForStatus(status) {
            switch (status) {
                case 'paid': return ['success', 'Payment received. Thank you!'];
                case 'pending': return ['info', 'Your payment has not been completed yet. If you were charged, please refresh this page in a minute or contact the atelier.'];
                case 'abandoned': return ['info', 'The payment was not completed. You can try again whenever you are ready.'];
                case 'failed': return ['error', 'The payment was not successful. Please try again.'];
                case 'reversed': return ['error', 'This payment was reversed. Please contact the atelier.'];
                case 'under_review': return ['info', 'We received your payment and the atelier is checking it. You do not need to pay again.'];
                case 'verification_unavailable':
                case 'busy': return ['info', 'We could not confirm your payment just yet. Please refresh this page in a moment.'];
                case 'unknown_reference': return ['error', 'We could not find this payment. Please contact the atelier if you were charged.'];
                default: return ['error', 'We could not confirm your payment. If you were charged, please contact the atelier.'];
            }
        }
        async function verifyPaymentReturn(reference, orderNumber) {
            result.innerHTML = '<p class="text-center text-xs text-brand-muted">Verifying your payment...</p>';
            let notice = noticeForStatus();
            try {
                // Only the payment reference is sent. Paystack is asked directly, on the server, whether it really succeeded.
                const response = await fetch(`${paymentWorkerUrl}/verify-payment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reference })
                });
                const verification = await response.json().catch(() => ({}));
                notice = noticeForStatus(verification.status);
            } catch (error) {
                console.error('Unable to verify Paystack payment:', error);
            }
            cleanPaymentParams();
            await trackOrder(orderNumber);
            showNotice(notice[0], notice[1]);
        }
        form.addEventListener('submit', (event) => { event.preventDefault(); trackOrder(input.value.trim().toUpperCase()); });
        const searchParams = new URLSearchParams(window.location.search);
        const initialOrder = searchParams.get('order');
        const paymentReference = searchParams.get('reference') || searchParams.get('trxref');
        const paymentCancelled = searchParams.get('payment') === 'cancelled';
        if (initialOrder) input.value = initialOrder;
        if (paymentReference && initialOrder) verifyPaymentReturn(paymentReference, initialOrder.toUpperCase());
        else if (initialOrder) {
            trackOrder(initialOrder.toUpperCase()).then(() => {
                if (paymentCancelled) { cleanPaymentParams(); showNotice('info', 'Payment cancelled. You have not been charged.'); }
            });
        }
        // If the customer presses Back from Paystack, reload so the Pay button is fresh.
        window.addEventListener('pageshow', (event) => { if (event.persisted) window.location.reload(); });
    </script>
</body>
</html>
