<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order | REMAGSTYLE</title>
    <link rel="icon" type="image/png" href="image/Logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { brand: { bg: '#F9F8F6', text: '#111111', muted: '#666666', border: '#E2DFD8' } }, fontFamily: { serif: ['Cormorant Garamond', 'Georgia', 'serif'], sans: ['Inter', 'sans-serif'] } } } };</script>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; } .font-serif { font-family: 'Cormorant Garamond', serif; }</style>
</head>
<body class="min-h-screen bg-brand-bg text-brand-text">
    <header class="border-b border-brand-border/60 bg-brand-bg/95"><nav class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4 sm:px-8 lg:px-12"><a href="index.html" aria-label="REMAGSTYLE home"><img src="image/Logo.png" alt="REMAGSTYLE" class="h-14 w-14 object-contain"></a><div class="flex items-center gap-4"><a href="guest-order.html" class="text-[10px] font-medium uppercase tracking-[0.18em] hover:opacity-50">Place Order</a><a href="index.html" class="text-[10px] font-medium uppercase tracking-[0.18em] hover:opacity-50">Back to site</a></div></nav></header>
    <main class="mx-auto max-w-2xl px-5 py-16 sm:px-8 sm:py-24"><div class="mb-8 text-center"><p class="text-[10px] font-medium uppercase tracking-[0.25em] text-brand-muted">Order Tracking</p><h1 class="mt-2 font-serif text-5xl font-light">Find your order</h1><p class="mx-auto mt-3 max-w-md text-xs leading-6 text-brand-muted">Enter the special order number from your confirmation. Account and guest orders use the same tracking form.</p></div><form id="track-form" class="flex flex-col gap-3 sm:flex-row"><input id="order-number" required placeholder="RS-2026-XXXXXXXX" class="min-w-0 flex-1 border border-brand-border bg-white px-4 py-3 text-xs uppercase tracking-[0.12em] focus:border-brand-text focus:outline-none"><button class="bg-brand-text px-6 py-3 text-[10px] font-medium uppercase tracking-[0.2em] text-white hover:bg-black/80">Track Order</button></form><div id="track-result" class="mt-8"></div></main>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getFirestore, getDoc, getDocs, query, where, collection, updateDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
        const app = initializeApp({ apiKey: "AIzaSyCzcxTLAUH83sQsia4dPg5py19YzRsmw0o", authDomain: "remagstyle-43b41.firebaseapp.com", projectId: "remagstyle-43b41", messagingSenderId: "145831201308", appId: "1:145831201308:web:489a014516356f73a72dd9" });
        const auth = getAuth(app);
        const db = getFirestore(app); const form = document.getElementById('track-form'); const input = document.getElementById('order-number'); const result = document.getElementById('track-result');
        function escapeHtml(value) { return String(value ?? '').replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[character]); }
        async function getOrderByNumber(orderNumber) {
            const direct = await getDoc(doc(db, 'orders', orderNumber));
            if (direct.exists()) return { id: direct.id, ...direct.data() };

            const snapshot = await getDocs(query(collection(db, 'orders'), where('orderNumber', '==', orderNumber)));
            if (snapshot.empty) return null;
            const match = snapshot.docs[0];
            return { id: match.id, ...match.data() };
        }

        async function trackOrder(orderNumber) {
            result.innerHTML = '<p class="text-center text-xs text-brand-muted">Looking up your order...</p>';
            try {
                const userCredential = auth.currentUser || (await signInAnonymously(auth));
                const order = await getOrderByNumber(orderNumber);
                if (!order) { result.innerHTML = '<p class="border border-red-200 bg-red-50 p-4 text-xs text-red-700">No order was found with that number. Check it and try again.</p>'; return; }
                const date = order.createdAt?.toDate?.().toLocaleDateString() || 'Just submitted';
                result.innerHTML = `<article class="border border-brand-border bg-white p-6"><div class="flex flex-wrap items-start justify-between gap-4"><div><p class="text-[10px] uppercase tracking-[0.2em] text-brand-muted">${escapeHtml(order.orderNumber)}</p><h2 class="mt-2 font-serif text-3xl">${escapeHtml(order.garment)}</h2><p class="mt-1 text-xs text-brand-muted">${escapeHtml(order.occasion)}</p></div><span class="border border-brand-border px-3 py-2 text-[10px] uppercase tracking-[0.15em]">${escapeHtml(order.status)}</span></div><div class="mt-6 grid grid-cols-2 gap-4 border-t border-brand-border pt-4 text-xs text-brand-muted"><p>Submitted<br><span class="text-brand-text">${escapeHtml(date)}</span></p><p>Delivery<br><span class="text-brand-text">${escapeHtml(order.deliveryStatus)}</span></p></div>${order.adminMessage ? `<div class="mt-5 border-l-2 border-brand-text bg-brand-bg px-3 py-2 text-[11px] leading-5 text-brand-text"><span class="font-medium uppercase tracking-[0.12em]">Atelier update</span><br>${escapeHtml(order.adminMessage)}</div><form id="guest-reply-form" class="mt-4 flex flex-col gap-2 sm:flex-row"><input name="clientReply" required maxlength="1000" placeholder="Reply to the atelier" class="min-w-0 flex-1 border border-brand-border bg-brand-bg px-3 py-2.5 text-[11px] focus:border-brand-text focus:outline-none"><button type="submit" class="bg-brand-text px-4 py-2.5 text-[10px] font-medium uppercase tracking-[0.15em] text-white hover:bg-black/80">Send reply</button></form>` : ''}${order.clientReply ? `<div class="mt-3 border-l-2 border-brand-border px-3 py-2 text-[11px] leading-5 text-brand-muted"><span class="font-medium uppercase tracking-[0.12em] text-brand-text">Your reply</span><br>${escapeHtml(order.clientReply)}</div>` : ''}</article>`;
                const replyForm = document.getElementById('guest-reply-form');
                replyForm?.addEventListener('submit', async (event) => {
                    event.preventDefault();
                    const button = replyForm.querySelector('button');
                    const reply = new FormData(replyForm).get('clientReply')?.toString().trim();
                    if (!reply || !userCredential?.user && !auth.currentUser) return;
                    button.disabled = true;
                    button.textContent = 'Sending...';
                    try {
                        await updateDoc(doc(db, 'orders', orderDocument.id), { clientReply: reply, clientReplyAt: serverTimestamp() });
                        order.clientReply = reply;
                        replyForm.outerHTML = `<div class="mt-3 border-l-2 border-brand-border px-3 py-2 text-[11px] leading-5 text-brand-muted"><span class="font-medium uppercase tracking-[0.12em] text-brand-text">Your reply</span><br>${escapeHtml(reply)}</div>`;
                    } catch (error) {
                        button.disabled = false;
                        button.textContent = 'Send reply';
                        console.error('Unable to send guest reply:', error);
                    }
                });
            } catch (error) { result.innerHTML = '<p class="border border-red-200 bg-red-50 p-4 text-xs text-red-700">We could not look up your order right now.</p>'; console.error('Unable to track order:', error); }
        }
        form.addEventListener('submit', (event) => { event.preventDefault(); trackOrder(input.value.trim().toUpperCase()); });
        const initialOrder = new URLSearchParams(window.location.search).get('order'); if (initialOrder) { input.value = initialOrder; trackOrder(initialOrder.toUpperCase()); }
    </script>
</body>
</html>
